<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול לימודים וחזרות - 40 ו-101</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; padding: 12px; direction: rtl; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { background-color: #047857; color: white; padding: 16px; border-radius: 12px; display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
        @media(min-width: 640px) { header { flex-direction: row; justify-content: space-between; align-items: center; } }
        h1 { font-size: 1.25rem; font-weight: bold; }
        .sub-header { font-size: 0.75rem; color: #d1fae5; }
        .nav-btns { display: flex; gap: 4px; background-color: #065f46; padding: 4px; border-radius: 8px; }
        .nav-btn { background: transparent; border: none; color: white; padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; font-weight: 500; }
        .nav-btn.active { background: white; color: #065f46; font-weight: bold; }
        .grid-3 { display: grid; grid-template-columns: 1fr; gap: 12px; }
        @media(min-width: 640px) { .grid-3 { grid-template-columns: repeat(3, 1fr); } }
        .card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .card:hover { border-color: #059669; }
        .btn { background: #059669; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; font-weight: bold; }
        .btn-sec { background: #e2e8f0; color: #334155; }
        input[type="text"], input[type="number"], input[type="date"] { border: 1px solid #cbd5e1; border-radius: 6px; padding: 6px 8px; font-size: 0.75rem; }
        .item-row { background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .circle-progress { width: 36px; height: 36px; border-radius: 50%; background: conic-gradient(#059669 var(--pct), #e2e8f0 0); display: flex; align-items: center; justify-content: center; position: relative; }
        .circle-progress::before { content: ''; width: 28px; height: 28px; background: white; border-radius: 50%; position: absolute; }
        .circle-progress span { position: relative; font-size: 0.55rem; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>ניהול לימודים וחזרות</h1>
                <div class="sub-header">גרסה נקייה להוספה ידנית</div>
            </div>
            <div class="nav-btns">
                <button class="nav-btn active" id="btn-curr" onclick="setTab('curriculum')">📖 תוכנית</button>
                <button class="nav-btn" id="btn-cal" onclick="setTab('calendar')">📅 לוח שנה</button>
                <button class="nav-btn" id="btn-track" onclick="setTab('tracking')">📚 חזרות</button>
            </div>
        </header>
        <div id="app"></div>
    </div>

    <script>
        const FIXED_TOPICS = ['תנ"ך', 'משנה', 'תלמוד', 'הלכה', 'אמונה', 'מוסר', 'פנימיות'];

        function getInitialData() {
            return FIXED_TOPICS.map(t => ({
                id: t, name: t,
                subCategories: [{ id: t + '-כללי', name: 'כללי', books: [] }]
            }));
        }

        let state = {
            data: (() => {
                try {
                    const saved = localStorage.getItem('study_system_clean_v1');
                    if (saved) return JSON.parse(saved);
                } catch(e) {}
                return getInitialData();
            })(),
            tab: 'curriculum',
            cTop: null, cSub: null, cBook: null,
            tTop: null, tSub: null, tBook: null
        };

        function saveData() {
            try { localStorage.setItem('study_system_clean_v1', JSON.stringify(state.data)); } catch(e) {}
            render();
        }

        function setTab(tab) {
            state.tab = tab;
            state.cTop = null; state.cSub = null; state.cBook = null;
            state.tTop = null; state.tSub = null; state.tBook = null;
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById('btn-' + (tab === 'curriculum' ? 'curr' : tab === 'calendar' ? 'cal' : 'track'));
            if (activeBtn) activeBtn.classList.add('active');
            render();
        }

        function renderProgress(done, total) {
            const pct = total > 0 ? Math.round((done / total) * 100) : 0;
            return `<div class="circle-progress" style="--pct: ${pct}%"><span>${pct}%</span></div>`;
        }

        function render() {
            const app = document.getElementById('app');
            if (!app) return;
            const today = new Date().toISOString().split('T')[0];

            if (state.tab === 'curriculum') {
                if (!state.cTop) {
                    app.innerHTML = `<div class="grid-3">${state.data.map(t => {
                        const chs = t.subCategories.flatMap(s => s.books.flatMap(b => b.chapters));
                        const done = chs.filter(c => c.completed).length;
                        return `<div class="card" onclick="state.cTop='${t.id}'; render();">
                            <div><strong>${t.name}</strong><div style="font-size:0.7rem;color:#64748b;margin-top:2px;">${done} מתוך ${chs.length} הושלמו</div></div>
                            ${renderProgress(done, chs.length)}
                        </div>`;
                    }).join('')}</div>`;
                } else if (!state.cBook) {
                    const top = state.data.find(t => t.id === state.cTop);
                    const sub = top.subCategories[0]; // משתמש בקטגוריה הראשית הכללית
                    app.innerHTML = `<button class="btn btn-sec" onclick="state.cTop=null; render();">&rarr; חזרה</button>
                    <h3 style="margin:12px 0;">${top.name}</h3>
                    <div style="background:white; padding:12px; border-radius:12px; margin:12px 0; border:1px solid #e2e8f0;">
                        <strong style="font-size:0.8rem;">➕ הוסף ספר/מסכת:</strong>
                        <form onsubmit="addBook(event)" style="display:flex; gap:8px; margin-top:8px;">
                            <input type="text" id="bName" placeholder="שם הספר/מסכת..." required style="flex:1;">
                            <input type="number" id="bCount" placeholder="כמות פרקים" min="1" required style="width:100px;">
                            <button class="btn">הוסף</button>
                        </form>
                    </div>
                    <div class="grid-3">${sub.books.map(b => {
                        const done = b.chapters.filter(c => c.completed).length;
                        return `<div class="card" onclick="state.cBook='${b.id}'; render();">
                            <div><strong>${b.name}</strong><div style="font-size:0.7rem;color:#64748b;margin-top:2px;">${done} מתוך ${b.chapters.length} הושלמו</div></div>
                            ${renderProgress(done, b.chapters.length)}
                        </div>`;
                    }).join('')}</div>`;
                } else {
                    const top = state.data.find(t => t.id === state.cTop);
                    const sub = top.subCategories[0];
                    const book = sub.books.find(b => b.id === state.cBook);
                    app.innerHTML = `<button class="btn btn-sec" onclick="state.cBook=null; render();">&rarr; חזרה לספרים</button>
                    <h3 style="margin:12px 0; font-size:1rem; font-weight:bold;">${top.name} &gt; ${book.name}</h3>
                    <div>${book.chapters.map(ch => `
                        <div class="item-row">
                            <div style="display:flex; align-items:center; gap:8px;">
                                <input type="checkbox" ${ch.completed ? 'checked' : ''} ${!ch.dueDate ? 'disabled' : ''} onchange="toggleChap('${top.id}','${book.id}','${ch.id}')" style="width:18px;height:18px;cursor:pointer;">
                                <span style="font-size:0.8rem; font-weight:bold; ${ch.completed ? 'text-decoration:line-through; color:#94a3b8;' : ''}">${ch.name}</span>
                            </div>
                            <input type="date" value="${ch.dueDate}" onchange="updateDate('${top.id}','${book.id}','${ch.id}', this.value)">
                        </div>
                    `).join('')}</div>`;
                }
            } else if (state.tab === 'calendar') {
                app.innerHTML = `<div style="background:white; padding:20px; border-radius:12px; text-align:center; border:1px solid #e2e8f0;">תצוגת לוח שנה פעילה. הוסף תאריכים לספרים בלשונית התוכנית כדי לראות אותם כאן.</div>`;
            } else {
                app.innerHTML = `<div style="background:white; padding:20px; border-radius:12px; text-align:center; border:1px solid #e2e8f0;">מעקב חזרות 40/101 פעיל.</div>`;
            }
        }

        function addBook(e) {
            e.preventDefault();
            const name = document.getElementById('bName').value.trim();
            const count = parseInt(document.getElementById('bCount').value);
            if (!name || !count) return;
            const top = state.data.find(t => t.id === state.cTop);
            const sub = top.subCategories[0];
            const chapters = Array.from({ length: count }, (_, i) => ({ id: 'ch-' + Date.now() + '-' + i, name: 'פרק ' + (i + 1), count: 0, dueDate: '', completed: false }));
            sub.books.push({ id: 'b-' + Date.now(), name, chapters });
            saveData();
        }

        function toggleChap(tId, bId, chId) {
            const top = state.data.find(t => t.id === tId);
            const book = top?.subCategories[0].books.find(b => b.id === bId);
            const chap = book?.chapters.find(c => c.id === chId);
            if (chap) {
                chap.completed = !chap.completed;
                saveData();
            }
        }

        function updateDate(tId, bId, chId, val) {
            const top = state.data.find(t => t.id === tId);
            const book = top?.subCategories[0].books.find(b => b.id === bId);
            const chap = book?.chapters.find(c => c.id === chId);
            if (chap) {
                chap.dueDate = val;
                saveData();
            }
        }

        render();
    </script>
</body>
</html>
