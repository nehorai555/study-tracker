<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול לימודים וחזרות - 40 ו-101</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const FIXED_TOPICS = ['תנ"ך', 'משנה', 'תלמוד', 'הלכה', 'אמונה', 'מוסר', 'פנימיות'];

        const P_GEN = ['בראשית', 'נח', 'לך לך', 'וירא', 'חיי שרה', 'תולדות', 'ויצא', 'וישלח', 'וישב', 'מקץ', 'ויגש', 'ויחי'];
        const P_EXO = ['שמות', 'וארא', 'בא', 'בשלח', 'יתרו', 'משפטים', 'תרומה', 'תצוה', 'כי תשא', 'ויקהל', 'פקודה'];
        const P_LEV = ['ויקרא', 'צו', 'שמיני', 'תזריע', 'מצורע', 'אחרי מות', 'קדושים', 'אמור', 'בהר', 'בחוקתי'];
        const P_NUM = ['במדבר', 'נשא', 'בהעלתך', 'שלח לך', 'קרח', 'חקת', 'בלק', 'פנחס', 'מטות', 'מסעי'];
        const P_DEU = ['דברים', 'ואתחנן', 'עקב', 'ראה', 'שופטים', 'כי תצא', 'כי תבוא', 'נצבים', 'וילך', 'האזינו', 'וזאת הברכה'];

        const getInitialData = () => [
            {
                id: 'תנ"ך', name: 'תנ"ך',
                subCategories: [
                    { id: 'תורה', name: 'תורה', books: [
                        { id: 'g', name: 'בראשית', chapters: P_GEN.map((n, i) => ({ id: 'g-'+i, name: n, count: 0, dueDate: '', completed: false })) },
                        { id: 'e', name: 'שמות', chapters: P_EXO.map((n, i) => ({ id: 'e-'+i, name: n, count: 0, dueDate: '', completed: false })) },
                        { id: 'l', name: 'ויקרא', chapters: P_LEV.map((n, i) => ({ id: 'l-'+i, name: n, count: 0, dueDate: '', completed: false })) },
                        { id: 'n', name: 'במדבר', chapters: P_NUM.map((n, i) => ({ id: 'n-'+i, name: n, count: 0, dueDate: '', completed: false })) },
                        { id: 'd', name: 'דברים', chapters: P_DEU.map((n, i) => ({ id: 'd-'+i, name: n, count: 0, dueDate: '', completed: false })) }
                    ]},
                    { id: 'נביאים', name: 'נביאים', books: [] },
                    { id: 'כתובים', name: 'כתובים', books: [] }
                ]
            },
            { id: 'משנה', name: 'משנה', subCategories: ['זרעים', 'מועד', 'נשים', 'נזיקין', 'קודשים', 'טהרות'].map(s => ({ id: 'מ-'+s, name: 'סדר '+s, books: [] })) },
            { id: 'תלמוד', name: 'תלמוד', subCategories: ['זרעים', 'מועד', 'נשים', 'נזיקין', 'קודשים', 'טהרות'].map(s => ({ id: 'ת-'+s, name: 'סדר '+s, books: [] })) },
            ...['הלכה', 'אמונה', 'מוסר', 'פנימיות'].map(t => ({ id: t, name: t, subCategories: [{ id: t+'-כללי', name: 'כללי', books: [] }] }))
        ];

        function getHebrewDate(dStr) {
            try {
                const d = new Date(dStr);
                return isNaN(d) ? dStr : new Intl.DateTimeFormat('he-IL-u-ca-hebrew', { day: 'numeric', month: 'long', year: 'numeric' }).format(d);
            } catch { return dStr; }
        }

        function CircularProgress({ count, max, color }) {
            const pct = Math.min(100, Math.round((count / max) * 100));
            return (
                <div className="flex flex-col items-center justify-center relative">
                    <svg className="w-10 h-10 transform -rotate-90">
                        <circle cx="20" cy="20" r="16" stroke="currentColor" strokeWidth="3" className="text-slate-200" fill="none" />
                        <circle cx="20" cy="20" r="16" stroke="currentColor" strokeWidth="3" strokeDasharray={100} strokeDashoffset={100 - pct} strokeLinecap="round" className={color} fill="none" />
                    </svg>
                    <span className="absolute text-[9px] font-bold text-slate-700">{pct}%</span>
                </div>
            );
        }

        function App() {
            const [data, setData] = useState(() => {
                for (let i = 21; i >= 16; i--) {
                    const saved = localStorage.getItem('study_system_v' + i);
                    if (saved) return JSON.parse(saved);
                }
                return getInitialData();
            });

            const [tab, setTab] = useState('curriculum');
            const [cTop, setCTop] = useState(null);
            const [cSub, setCSub] = useState(null);
            const [cBook, setCBook] = useState(null);
            const [tTop, setTTop] = useState(null);
            const [tSub, setTSub] = useState(null);
            const [tBook, setTBook] = useState(null);
            const [bName, setBName] = useState('');
            const [bCount, setBCount] = useState('');

            const today = new Date().toISOString().split('T')[0];
            const todayRef = useRef(null);

            useEffect(() => {
                localStorage.setItem('study_system_v21', JSON.stringify(data));
            }, [data]);

            useEffect(() => {
                if (tab === 'calendar' && todayRef.current) todayRef.current.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, [tab]);

            const addCustomBook = (e, tId, sId) => {
                e.preventDefault();
                if (!bName.trim() || !bCount) return;
                const chapters = Array.from({ length: parseInt(bCount) }, (_, i) => ({
                    id: Date.now() + '-' + i, name: 'פרק/סימן ' + (i + 1), count: 0, dueDate: '', completed: false
                }));
                setData(data.map(t => t.id !== tId ? t : {
                    ...t, subCategories: t.subCategories.map(s => s.id !== sId ? s : {
                        ...s, books: [...s.books, { id: Date.now().toString(), name: bName.trim(), chapters }]
                    })
                }));
                setBName(''); setBCount('');
            };

            const toggleChap = (tId, sId, bId, chId) => {
                setData(data.map(t => t.id !== tId ? t : {
                    ...t, subCategories: t.subCategories.map(s => s.id !== sId ? s : {
                        ...s, books: s.books.map(b => b.id !== bId ? b : {
                            ...b, chapters: b.chapters.map(c => c.id !== chId ? c : { ...c, completed: !c.completed, count: !c.completed && c.count === 0 ? 0 : c.count })
                        })
                    })
                }));
            };

            const updateDate = (tId, sId, bId, chId, date) => {
                setData(data.map(t => t.id !== tId ? t : {
                    ...t, subCategories: t.subCategories.map(s => s.id !== sId ? s : {
                        ...s, books: s.books.map(b => b.id !== bId ? b : {
                            ...b, chapters: b.chapters.map(c => c.id !== chId ? c : { ...c, dueDate: date })
                        })
                    })
                }));
            };

            const updateCnt = (tId, sId, bId, chId, delta) => {
                setData(data.map(t => t.id !== tId ? t : {
                    ...t, subCategories: t.subCategories.map(s => s.id !== sId ? s : {
                        ...s, books: s.books.map(b => b.id !== bId ? b : {
                            ...b, chapters: b.chapters.map(c => c.id !== chId ? c : { ...c, count: Math.max(0, Math.min(101, (c.count || 0) + delta)) })
                        })
                    })
                }));
            };

            const allTasks = data.flatMap(t => t.subCategories.flatMap(s => s.books.flatMap(b => b.chapters.filter(c => c.dueDate).map(c => ({ ...c, tId: t.id, tName: t.name, sId: s.id, bId: b.id, bName: b.name })))));
            const overdue = allTasks.filter(c => !c.completed && c.dueDate < today);
            const dates = Array.from({ length: 361 }, (_, i) => {
                const d = new Date(today);
                d.setDate(d.getDate() + i - 180);
                return d.toISOString().split('T')[0];
            });

            return (
                <div className="max-w-7xl mx-auto p-3 sm:p-5">
                    <header className="bg-emerald-700 text-white p-4 rounded-xl shadow mb-4 flex flex-col sm:flex-row justify-between items-center gap-2">
                        <div>
                            <h1 className="text-xl font-bold">ניהול לימודים וחזרות</h1>
                            <p className="text-emerald-100 text-xs">מערכת 40 ו-101</p>
                        </div>
                        <div className="flex bg-emerald-800 p-1 rounded-lg gap-1">
                            {['curriculum', 'calendar', 'tracking'].map((k, idx) => (
                                <button key={k} onClick={() => { setTab(k); setCTop(null); setCSub(null); setCBook(null); setTTop(null); setTSub(null); setTBook(null); }}
                                    className={`px-3 py-1.5 rounded text-xs font-medium transition ${tab === k ? 'bg-white text-emerald-800 shadow' : 'text-white hover:bg-emerald-600'}`}>
                                    {['📖 תוכנית', '📅 לוח שנה', '📚 חזרות'][idx]}
                                </button>
                            ))}
                        </div>
                    </header>

                    {tab === 'curriculum' && (
                        <div className="space-y-3">
                            {!cTop && (
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                    {data.map(t => {
                                        const chs = t.subCategories.flatMap(s => s.books.flatMap(b => b.chapters));
                                        const done = chs.filter(c => c.completed).length;
                                        return (
                                            <div key={t.id} onClick={() => setCTop(t.id)} className="bg-white p-4 rounded-xl border shadow-2xs cursor-pointer hover:border-emerald-500 flex items-center justify-between">
                                                <div>
                                                    <h3 className="font-bold text-slate-800">{t.name}</h3>
                                                    <p className="text-[11px] text-slate-400">{done} / {chs.length} הושלמו</p>
                                                </div>
                                                <CircularProgress count={done} max={chs.length || 1} color="text-emerald-600" />
                                            </div>
                                        );
                                    })}
                                </div>
                            )}

                            {cTop && !cSub && (
                                <div className="space-y-3">
                                    <button onClick={() => setCTop(null)} className="bg-slate-200 px-3 py-1 rounded text-xs font-bold">&rarr; חזרה</button>
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                        {data.find(t => t.id === cTop)?.subCategories.map(s => {
                                            const chs = s.books.flatMap(b => b.chapters);
                                            const done = chs.filter(c => c.completed).length;
                                            return (
                                                <div key={s.id} onClick={() => setCSub(s.id)} className="bg-white p-4 rounded-xl border shadow-2xs cursor-pointer hover:border-emerald-500 flex items-center justify-between">
                                                    <div>
                                                        <h3 className="font-bold text-slate-800">{s.name}</h3>
                                                        <p className="text-[11px] text-slate-400">{done} / {chs.length} הושלמו</p>
                                                    </div>
                                                    <CircularProgress count={done} max={chs.length || 1} color="text-emerald-600" />
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}

                            {cTop && cSub && !cBook && (
                                <div className="space-y-3">
                                    <button onClick={() => setCSub(null)} className="bg-slate-200 px-3 py-1 rounded text-xs font-bold">&rarr; חזרה</button>
                                    <form onSubmit={e => addCustomBook(e, cTop, cSub)} className="bg-white p-3 rounded-xl border flex gap-2">
                                        <input type="text" placeholder="שם הספר..." value={bName} onChange={e => setBName(e.target.value)} className="border rounded px-2 py-1 text-xs flex-1" required />
                                        <input type="number" min="1" placeholder="כמות פרקים" value={bCount} onChange={e => setBCount(e.target.value)} className="border rounded px-2 py-1 text-xs w-28" required />
                                        <button className="bg-emerald-600 text-white px-3 py-1 rounded text-xs font-bold">הוסף</button>
                                    </form>
                                    <div className="space-y-2">
                                        {data.find(t => t.id === cTop)?.subCategories.find(s => s.id === cSub)?.books.map(b => {
                                            const done = b.chapters.filter(c => c.completed).length;
                                            return (
                                                <div key={b.id} onClick={() => setCBook(b.id)} className="bg-white p-3 rounded-xl border cursor-pointer hover:border-emerald-500 flex justify-between items-center">
                                                    <span className="font-bold text-sm">{b.name} ({done}/{b.chapters.length})</span>
                                                    <CircularProgress count={done} max={b.chapters.length || 1} color="text-emerald-600" />
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}

                            {cTop && cSub && cBook && (
                                <div className="space-y-2">
                                    <button onClick={() => setCBook(null)} className="bg-slate-200 px-3 py-1 rounded text-xs font-bold">&rarr; חזרה</button>
                                    {data.find(t => t.id === cTop)?.subCategories.find(s => s.id === cSub)?.books.find(b => b.id === cBook)?.chapters.map(ch => (
                                        <div key={ch.id} className={`p-2.5 rounded-lg border flex justify-between items-center ${ch.completed ? 'bg-emerald-50 border-emerald-300' : 'bg-white'}`}>
                                            <div className="flex items-center gap-2">
                                                <input type="checkbox" checked={ch.completed} disabled={!ch.dueDate} onChange={() => toggleChap(cTop, cSub, cBook, ch.id)} className="w-4 h-4 accent-emerald-600 cursor-pointer" />
                                                <span className={`text-xs font-bold ${ch.completed ? 'line-through text-slate-400' : ''}`}>{ch.name}</span>
                                            </div>
                                            <input type="date" value={ch.dueDate} onChange={e => updateDate(cTop, cSub, cBook, ch.id, e.target.value)} className="border rounded px-2 py-0.5 text-xs" />
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}

                    {tab === 'calendar' && (
                        <div className="grid grid-cols-1 lg:grid-cols-4 gap-3">
                            <div className="lg:col-span-3 space-y-2 max-h-[700px] overflow-y-auto pr-1">
                                {dates.map(dStr => {
                                    const isToday = dStr === today;
                                    const isYellow = dStr < today || isToday;
                                    const dTasks = allTasks.filter(t => t.dueDate === dStr);
                                    return (
                                        <div key={dStr} ref={isToday ? todayRef : null} className="bg-white rounded-xl border p-2 flex gap-2 items-center">
                                            <div className={`w-36 p-2 rounded border text-center shrink-0 ${isYellow ? 'bg-amber-200 font-bold' : 'bg-white'}`}>
                                                <span className="text-[11px] block">{getHebrewDate(dStr)}</span>
                                                <span className="text-[9px] opacity-70">({dStr})</span>
                                            </div>
                                            <div className="grid grid-cols-7 gap-1 flex-1">
                                                {FIXED_TOPICS.map(top => (
                                                    <div key={top} className="bg-slate-50 p-1 rounded border min-h-[50px] flex flex-col justify-between">
                                                        <span className="text-[8px] font-bold text-emerald-800 border-b pb-0.5">{top}</span>
                                                        <div className="space-y-0.5">
                                                            {dTasks.filter(t => t.tName === top).map(t => (
                                                                <div key={t.id} className={`flex justify-between items-center p-0.5 rounded text-[8px] border ${t.completed ? 'bg-emerald-100 line-through' : t.dueDate < today ? 'bg-rose-100 text-rose-900 font-bold' : 'bg-white'}`}>
                                                                    <span className="truncate">{t.bName}: {t.name}</span>
                                                                    <input type="checkbox" checked={t.completed} onChange={() => toggleChap(t.tId, t.sId, t.bId, t.id)} className="w-3 h-3 accent-emerald-600" />
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                            <div className="bg-white p-3 rounded-xl border border-rose-200 space-y-2 h-fit lg:sticky lg:top-3">
                                <h3 className="text-xs font-bold text-rose-900 border-b pb-1.5 flex justify-between">
                                    <span>⚠️ משימות שלא בוצעו</span>
                                    <span className="bg-rose-100 text-rose-800 px-1.5 rounded-full text-[9px]">{overdue.length}</span>
                                </h3>
                                <div className="max-h-[600px] overflow-y-auto space-y-1.5">
                                    {overdue.length === 0 ? <p className="text-[11px] text-slate-400 text-center py-4">הכל בוצע בזמן!</p> : overdue.map(t => (
                                        <div key={t.id} className="bg-rose-50 p-2 rounded border border-rose-200 text-xs flex justify-between items-center">
                                            <div className="truncate pr-1">
                                                <p className="font-bold text-[11px] text-rose-900 truncate">{t.bName}: {t.name}</p>
                                                <p className="text-[9px] text-rose-700">יעד: {t.dueDate}</p>
                                            </div>
                                            <input type="checkbox" checked={t.completed} onChange={() => toggleChap(t.tId, t.sId, t.bId, t.id)} className="w-4 h-4 accent-emerald-600 shrink-0" />
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {tab === 'tracking' && (
                        <div className="space-y-3">
                            {!tTop && <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                {data.map(t => (
                                    <div key={t.id} onClick={() => setTTop(t.id)} className="bg-white p-4 rounded-xl border cursor-pointer hover:border-emerald-500">
                                        <h3 className="font-bold text-sm">{t.name}</h3>
                                    </div>
                                ))}
                            </div>}
                            {tTop && !tSub && <div className="space-y-2">
                                <button onClick={() => setTTop(null)} className="bg-slate-200 px-3 py-1 rounded text-xs font-bold">&rarr; חזרה</button>
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                    {data.find(t => t.id === tTop)?.subCategories.map(s => (
                                        <div key={s.id} onClick={() => setTSub(s.id)} className="bg-white p-4 rounded-xl border cursor-pointer hover:border-emerald-500">
                                            <h3 className="font-bold text-sm">{s.name}</h3>
                                        </div>
                                    ))}
                                </div>
                            </div>}
                            {tTop && tSub && !tBook && <div className="space-y-2">
                                <button onClick={() => setTSub(null)} className="bg-slate-200 px-3 py-1 rounded text-xs font-bold">&rarr; חזרה</button>
                                <div className="space-y-2">
                                    {data.find(t => t.id === tTop)?.subCategories.find(s => s.id === tSub)?.books.map(b => {
                                        const active = b.chapters.filter(c => c.completed);
                                        if (active.length === 0) return null;
                                        return (
                                            <div key={b.id} onClick={() => setTBook(b.id)} className="bg-white p-3 rounded-xl border cursor-pointer hover:border-emerald-500 flex justify-between items-center">
                                                <span className="font-bold text-xs">{b.name} ({active.length} פעילים)</span>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>}
                            {tTop && tSub && tBook && (() => {
                                const b = data.find(t => t.id === tTop)?.subCategories.find(s => s.id === tSub)?.books.find(x => x.id === tBook);
                                return (
                                    <div className="space-y-2">
                                        <button onClick={() => setTBook(null)} className="bg-slate-200 px-3 py-1 rounded text-xs font-bold">&rarr; חזרה</button>
                                        {b?.chapters.filter(c => c.completed).map(ch => {
                                            const cnt = ch.count || 0;
                                            const tgt = cnt <= 40 ? 40 : 101;
                                            return (
                                                <div key={ch.id} className="bg-white p-3 rounded-xl border flex justify-between items-center">
                                                    <div>
                                                        <h4 className="font-bold text-xs">{ch.name}</h4>
                                                        <p className="text-[10px] text-slate-400">חזרות: {cnt} / {tgt}</p>
                                                    </div>
                                                    <div className="flex items-center gap-2">
                                                        <CircularProgress count={cnt} max={tgt} color={cnt > 40 ? 'text-blue-600' : 'text-emerald-600'} />
                                                        <div className="flex items-center gap-1 bg-slate-50 p-1 rounded border">
                                                            <button onClick={() => updateCnt(tTop, tSub, tBook, ch.id, -1)} className="w-5 h-5 bg-white rounded border text-xs font-bold">-</button>
                                                            <span className="w-6 text-center text-xs font-bold">{cnt}</span>
                                                            <button onClick={() => updateCnt(tTop, tSub, tBook, ch.id, 1)} className="w-5 h-5 bg-emerald-600 text-white rounded text-xs font-bold">+</button>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                );
                            })()}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
