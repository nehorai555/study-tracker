<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>בדיקת שגיאות מהפלאפון</title>
</head>
<body style="font-family:sans-serif; padding:20px; background:#f8fafc; color:#1e293b;">
    <h2>בדיקת תקלות למובייל</h2>
    <div id="log" style="background:#fff; border:1px solid #cbd5e1; padding:15px; border-radius:8px; margin-top:15px; white-space:pre-wrap; font-family:monospace; font-size:12px;">מאתחל בדיקה...</div>

    <script>
        const logBox = document.getElementById('log');
        function addLog(text, isError = false) {
            logBox.innerHTML += `<div style="color: ${isError ? 'red' : 'green'}; margin-top:5px;">${text}</div>`;
        }

        window.onerror = function(msg, url, line, col) {
            addLog(`שגיאה: ${msg} (שורה: ${line})`, true);
            return true;
        };

        addLog("בודק LocalStorage...");
        try {
            localStorage.setItem('test_key', '123');
            localStorage.removeItem('test_key');
            addLog("LocalStorage תקין לחלוטין.");
        } catch(e) {
            addLog("שגיאה ב-LocalStorage: " + e.message, true);
        }

        addLog("המערכת מוכנה להרצה.");
    </script>
</body>
</html>
