<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול לימודים וחזרות - 40 ו-101</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // רכיב עיגול התקדמות (Circular Progress Bar)
        function CircularProgress({ count, max, colorClass, label }) {
            const percentage = Math.min(100, Math.round((count / max) * 100));
            const radius = 22;
            const circumference = 2 * Math.PI * radius;
            const strokeDashoffset = circumference - (percentage / 100) * circumference;

            return (
                <div className="flex flex-col items-center justify-center relative">
                    <svg className="w-14 h-14 transform -rotate-90">
                        <circle
                            cx="28" cy="28" r={radius}
                            stroke="currentColor" strokeWidth="4"
                            className="text-slate-200" fill="transparent"
                        />
                        <circle
                            cx="28" cy="28" r={radius}
                            stroke="currentColor" strokeWidth="4"
                            strokeDasharray={circumference}
                            strokeDashoffset={strokeDashoffset}
                            strokeLinecap="round"
                            className={`${colorClass} transition-all duration-300`}
                            fill="transparent"
                        />
                    </svg>
                    <div className="absolute inset-0 flex flex-col items-center justify-center text-center">
                        <span className="text-xs font-extrabold leading-none text-slate-700">{percentage}%</span>
                    </div>
                    <span className="text-[10px] font-bold mt-1 text-slate-500">{label}</span>
                </div>
            );
        }

        function App() {
            const [topics, setTopics] = useState(() => {
                const saved = localStorage.getItem('study_topics_v10');
                if (saved) return JSON.parse(saved);
                return [
                    {
                        id: '1',
                        name: 'תלמוד בבלי',
                        books: [
                            {
                                id: 'b1',
                                name: 'מסכת ברכות',
                                chapters: [
                                    { id: 'c1', name: 'פרק א - מאמתי', count: 10, dueDate: '2026-11-05', completed: true },
                                    { id: 'c2', name: 'פרק ב - היה קורא', count: 0, dueDate: '2026-11-10', completed: false }
                                ]
                            }
                        ]
                    }
                ];
            });

            const [activeTab, setActiveTab] = useState('calendar');
            
            // מצבי ניווט היררכיים בלשונית החזרות
            const [selectedTopicId, setSelectedTopicId] = useState(null);
            const [selectedBookId, setSelectedBookId] = useState(null);

            // טופס הוספה
            const [inputTopic, setInputTopic] = useState('');
            const [inputBook, setInputBook] = useState('');
            const [inputChapter, setInputChapter] = useState('');
            const [inputDueDate, setInputDueDate] = useState('');

            useEffect(() => {
                localStorage.setItem('study_topics_v10', JSON.stringify(topics));
            }, [topics]);

            const handleAddNewTask = (e) => {
                e.preventDefault();
                if (!inputTopic.trim() || !inputBook.trim() || !inputChapter.trim()) return;

                const topicName = inputTopic.trim();
                const bookName = inputBook.trim();
                const chapterName = inputChapter.trim();
                const dueDate = inputDueDate || new Date().toISOString().split('T')[0];

                let newTopics = [...topics];
                let existingTopic = newTopics.find(t => t.name === topicName);

                if (!existingTopic) {
                    existingTopic = { id: Date.now().toString(), name: topicName, books: [] };
                    newTopics.push(existingTopic);
                }

                let existingBook = existingTopic.books.find(b => b.name === bookName);
                if (!existingBook) {
                    existingBook = { id: (Date.now() + 1).toString(), name: bookName, chapters: [] };
                    existingTopic.books.push(existingBook);
                }

                existingBook.chapters.push({
                    id: (Date.now() + 2).toString(),
                    name: chapterName,
                    count: 0,
                    dueDate: dueDate,
                    completed: false
                });

                setTopics(newTopics);
                setInputChapter('');
                setInputDueDate('');
            };

            const toggleChapterCompletion = (topicId, bookId, chapterId, currentStatus) => {
                setTopics(topics.map(t => {
                    if (t.id !== topicId) return t;
                    return {
                        ...t,
                        books: t.books.map(b => {
                            if (b.id !== bookId) return b;
                            return {
                                ...b,
                                chapters: b.chapters.map(c => {
                                    if (c.id !== chapterId) return c;
                                    const nextStatus = !currentStatus;
                                    return {
                                        ...c,
                                        completed: nextStatus,
                                        count: nextStatus && c.count === 0 ? 1 : c.count
                                    };
                                })
                            };
                        })
                    };
                }));
            };

            const updateCount = (topicId, bookId, chapterId, delta) => {
                setTopics(topics.map(t => {
                    if (t.id !== topicId) return t;
                    return {
                        ...t,
                        books: t.books.map(b => {
                            if (b.id !== bookId) return b;
                            return {
                                ...b,
                                chapters: b.chapters.map(c => {
                                    if (c.id !== chapterId) return c;
                                    const newVal = Math.max(0, Math.min(101, (c.count || 0) + delta));
                                    return { ...c, count: newVal };
                                })
                            };
                        })
                    };
                }));
            };

            // חישוב ממוצע שקלול ספר (מתוך 40 ומתוך 101) עבור כל הפרקים שבו
            const getBookStats = (chapters) => {
                const activeChapters = chapters.filter(c => c.completed);
                if (activeChapters.length === 0) return { total40: 0, total101: 0 };

                const sum40 = activeChapters.reduce((acc, c) => acc + Math.min(c.count, 40), 0);
                const sum101 = activeChapters.reduce((acc, c) => acc + Math.min(c.count, 101), 0);
                
                const max40 = activeChapters.length * 40;
                const max101 = activeChapters.length * 101;

                return {
                    avg40: Math.round((sum40 / max40) * 40), // לצורך הצגת ממוצע החזרות המשוקլל בספר או אחוזים
                    avg101: Math.round((sum101 / max101) * 101),
                    rawSum40: sum40,
                    rawMax40: max40,
                    rawSum101: sum101,
                    rawMax101: max101
                };
            };

            return (
                <div className="max-w-4xl mx-auto p-4 sm:p-6">
                    <header className="bg-emerald-700 text-white p-6 rounded-2xl shadow-md mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
                        <div>
                            <h1 className="text-2xl sm:text-3xl font-bold">מעקב לימודים וחזרות</h1>
                            <p className="text-emerald-100 text-sm mt-1">מערכת חכמה לניהול חזורי 40 ו-101</p>
                        </div>
                        <div className="flex bg-emerald-800 p-1 rounded-xl">
                            <button 
                                onClick={() => setActiveTab('calendar')}
                                className={`px-4 py-2 rounded-lg text-sm font-medium transition ${activeTab === 'calendar' ? 'bg-white text-emerald-800 shadow' : 'text-white hover:bg-emerald-700'}`}>
                                📅 לוח שנה ומשימות
                            </button>
                            <button 
                                onClick={() => { setActiveTab('topics'); setSelectedTopicId(null); setSelectedBookId(null); }}
                                className={`px-4 py-2 rounded-lg text-sm font-medium transition ${activeTab === 'topics' ? 'bg-white text-emerald-800 shadow' : 'text-white hover:bg-emerald-700'}`}>
                                📚 מעקב חזרות
                            </button>
                        </div>
                    </header>

                    {/* לשונית 1: לוח שנה ומשימות */}
                    {activeTab === 'calendar' && (
                        <div className="space-y-6">
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                                <h2 className="text-lg font-bold text-slate-800 mb-3 flex items-center gap-2">
                                    <span>➕</span> הוספת לימוד חדש למשימות
                                </h2>
                                <form onSubmit={handleAddNewTask} className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">נושא</label>
                                        <input 
                                            type="text" placeholder="שם הנושא..." value={inputTopic}
                                            onChange={e => setInputTopic(e.target.value)}
                                            className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-emerald-600" required
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">ספר / מסכת</label>
                                        <input 
                                            type="text" placeholder="שם הספר..." value={inputBook}
                                            onChange={e => setInputBook(e.target.value)}
                                            className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-emerald-600" required
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">פרק / סימן</label>
                                        <input 
                                            type="text" placeholder="שם הפרק..." value={inputChapter}
                                            onChange={e => setInputChapter(e.target.value)}
                                            className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-emerald-600" required
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">תאריך יעד</label>
                                        <div className="flex gap-2">
                                            <input 
                                                type="date" value={inputDueDate}
                                                onChange={e => setInputDueDate(e.target.value)}
                                                className="w-full border border-slate-300 rounded-lg px-2 py-2 text-sm focus:outline-emerald-600"
                                            />
                                            <button type="submit" className="bg-emerald-600 text-white font-bold px-4 py-2 rounded-lg text-sm hover:bg-emerald-700 shrink-0">הוסף</button>
                                        </div>
                                    </div>
                                </form>
                            </div>

                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                                <h2 className="text-xl font-bold text-emerald-900 border-b pb-2">משימות לימוד</h2>
                                <div className="space-y-3">
                                    {topics.flatMap(t => t.books.flatMap(b => b.chapters.map(c => ({ ...c, topicName: t.name, bookName: b.name, topicId: t.id, bookId: b.id }))))
                                        .sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate))
                                        .map(task => {
                                            const isOverdue = !task.completed && new Date(task.dueDate) < new Date(new Date().toDateString());
                                            return (
                                                <div key={task.id} className={`p-4 rounded-xl border transition flex items-center justify-between gap-4 ${task.completed ? 'bg-emerald-50/60 border-emerald-300' : isOverdue ? 'bg-rose-50/60 border-rose-200' : 'bg-white border-slate-200'}`}>
                                                    <div className="flex items-center gap-3">
                                                        <input 
                                                            type="checkbox" checked={task.completed} 
                                                            onChange={() => toggleChapterCompletion(task.topicId, task.bookId, task.id, task.completed)}
                                                            className="w-6 h-6 accent-emerald-600 rounded cursor-pointer"
                                                        />
                                                        <div>
                                                            <div className="text-xs font-semibold text-slate-500">{task.topicName} &gt; {task.bookName}</div>
                                                            <div className={`font-bold text-base ${task.completed ? 'line-through text-slate-400' : 'text-slate-800'}`}>{task.name}</div>
                                                        </div>
                                                    </div>
                                                    <span className={`text-xs px-3 py-1.5 rounded-full font-bold ${task.completed ? 'bg-emerald-100 text-emerald-800' : isOverdue ? 'bg-rose-100 text-rose-800' : 'bg-slate-100 text-slate-600'}`}>
                                                        {task.completed ? 'בוצע ✓ (נפתח למעקב)' : isOverdue ? `עבר הזמן (${task.dueDate})` : `יעד: ${task.dueDate}`}
                                                    </span>
                                                </div>
                                            );
                                        })}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* לשונית 2: מעקב חזרות (ניווט היררכי: נושא ➔ ספר ➔ פרקים) */}
                    {activeTab === 'topics' && (
                        <div className="space-y-6">
                            {/* רמה א': בחירת נושא */}
                            {!selectedTopicId && (
                                <div className="space-y-4">
                                    <h2 className="text-xl font-bold text-emerald-900">בחר נושא לימוד:</h2>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        {topics.map(topic => {
                                            const hasActiveChapters = topic.books.some(b => b.chapters.some(c => c.completed));
                                            if (!hasActiveChapters) return null;

                                            return (
                                                <div 
                                                    key={topic.id}
                                                    onClick={() => setSelectedTopicId(topic.id)}
                                                    className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:border-emerald-500 cursor-pointer transition flex items-center justify-between group">
                                                    <div>
                                                        <h3 className="text-lg font-bold text-slate-800 group-hover:text-emerald-700 transition">{topic.name}</h3>
                                                        <p className="text-xs text-slate-400 mt-1">{topic.books.length} ספרים במסגרת</p>
                                                    </div>
                                                    <span className="text-emerald-600 font-bold text-lg">&larr;</span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}

                            {/* רמה ב': בחירת ספר מתוך הנושא הנבחר */}
                            {selectedTopicId && !selectedBookId && (() => {
                                const topic = topics.find(t => t.id === selectedTopicId);
                                if (!topic) return null;

                                return (
                                    <div className="space-y-4">
                                        <div className="flex items-center gap-3">
                                            <button 
                                                onClick={() => setSelectedTopicId(null)}
                                                className="bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-sm font-bold hover:bg-slate-300 transition">
                                                &rarr; חזרה לנושאים
                                            </button>
                                            <h2 className="text-xl font-bold text-emerald-900">{topic.name} &gt; בחר ספר:</h2>
                                        </div>

                                        <div className="grid grid-cols-1 gap-4">
                                            {topic.books.map(book => {
                                                const completedChapters = book.chapters.filter(c => c.completed);
                                                if (completedChapters.length === 0) return null;

                                                const stats = getBookStats(book.chapters);

                                                return (
                                                    <div 
                                                        key={book.id}
                                                        onClick={() => setSelectedBookId(book.id)}
                                                        className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 hover:border-emerald-500 cursor-pointer transition flex flex-col sm:flex-row items-center justify-between gap-4">
                                                        <div>
                                                            <h3 className="text-lg font-bold text-slate-800">{book.name}</h3>
                                                            <p className="text-xs text-slate-400 mt-0.5">{completedChapters.length} פרקים פעילים למעקב</p>
                                                        </div>

                                                        {/* שני מעגלי התקדמות משוקללים לספר (40 ו-101) */}
                                                        <div className="flex items-center gap-6 bg-slate-50 px-4 py-2 rounded-xl border border-slate-100">
                                                            <div className="flex items-center gap-2">
                                                                <CircularProgress 
                                                                    count={stats.rawSum40} 
                                                                    max={stats.rawMax40} 
                                                                    colorClass="text-emerald-600" 
                                                                    label="יעד 40"
                                                                />
                                                            </div>
                                                            <div className="h-8 w-px bg-slate-200"></div>
                                                            <div className="flex items-center gap-2">
                                                                <CircularProgress 
                                                                    count={stats.rawSum101} 
                                                                    max={stats.rawMax101} 
                                                                    colorClass="text-blue-600" 
                                                                    label="יעד 101"
                                                                />
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                );
                            })()}

                            {/* רמה ג': הצגת הפרקים של הספר הנבחר ומעקב חזרות */}
                            {selectedTopicId && selectedBookId && (() => {
                                const topic = topics.find(t => t.id === selectedTopicId);
                                const book = topic?.books.find(b => b.id === selectedBookId);
                                if (!topic || !book) return null;

                                const completedChapters = book.chapters.filter(c => c.completed);

                                return (
                                    <div className="space-y-4">
                                        <div className="flex items-center gap-3 border-b pb-3">
                                            <button 
                                                onClick={() => setSelectedBookId(null)}
                                                className="bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-sm font-bold hover:bg-slate-300 transition">
                                                &rarr; חזרה לספרים
                                            </button>
                                            <h2 className="text-xl font-extrabold text-emerald-900">{topic.name} &gt; {book.name}</h2>
                                        </div>

                                        <div className="grid grid-cols-1 gap-3">
                                            {completedChapters.map(chapter => {
                                                const count = chapter.count || 0;
                                                const target = count <= 40 ? 40 : 101;
                                                const percentage = Math.min(100, Math.round((count / target) * 100));
                                                const isPhase101 = count > 40;

                                                return (
                                                    <div key={chapter.id} className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4">
                                                        <div className="flex items-center gap-3 w-full sm:w-auto">
                                                            <div className={`w-3 h-3 rounded-full shrink-0 ${isPhase101 ? 'bg-blue-500' : 'bg-emerald-500'}`}></div>
                                                            <div>
                                                                <h4 className="font-bold text-base text-slate-800">{chapter.name}</h4>
                                                                <p className="text-xs text-slate-400">
                                                                    חזרות: <span className="font-bold text-slate-700">{count}</span> מתוך <span className="font-bold text-slate-700">{target}</span>
                                                                </p>
                                                            </div>
                                                        </div>

                                                        {/* מעגל התקדמות יחיד לפרק ופתרות */}
                                                        <div className="flex items-center gap-4 w-full sm:w-auto justify-between bg-slate-50 px-4 py-2 rounded-xl border border-slate-100">
                                                            <div className="flex items-center gap-3">
                                                                <CircularProgress 
                                                                    count={count} 
                                                                    max={target} 
                                                                    colorClass={isPhase101 ? 'text-blue-600' : 'text-emerald-600'} 
                                                                    label={isPhase101 ? 'יעד 101' : 'יעד 40'}
                                                                />
                                                            </div>

                                                            <div className="flex items-center gap-1 bg-white p-1 rounded-lg border border-slate-200 shadow-sm mr-2">
                                                                <button onClick={() => updateCount(topic.id, book.id, chapter.id, -1)} className="w-7 h-7 bg-slate-100 text-slate-700 rounded-md font-bold hover:bg-slate-200 text-sm flex items-center justify-center">-</button>
                                                                <span className="w-8 text-center text-sm font-extrabold text-slate-800">{count}</span>
                                                                <button onClick={() => updateCount(topic.id, book.id, chapter.id, 1)} className="w-7 h-7 bg-emerald-600 text-white rounded-md font-bold hover:bg-emerald-700 text-sm flex items-center justify-center">+</button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                );
                            })()}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
