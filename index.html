<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול לימודים וחזרות - 40 ו-101</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const FIXED_TOPICS = ['תנ"ך', 'משנה', 'תלמוד', 'הלכה', 'אמונה', 'מוסר', 'פנימיות'];

        function getHebrewDateString(dateStr) {
            try {
                const date = new Date(dateStr);
                if (isNaN(date.getTime())) return dateStr;
                const formatter = new Intl.DateTimeFormat('he-IL-u-ca-hebrew', {
                    day: 'numeric',
                    month: 'long',
                    year: 'numeric'
                });
                return formatter.format(date);
            } catch (e) {
                return dateStr;
            }
        }

        function CircularProgress({ count, max, colorClass, label }) {
            const percentage = Math.min(100, Math.round((count / max) * 100));
            const radius = 22;
            const circumference = 2 * Math.PI * radius;
            const strokeDashoffset = circumference - (percentage / 100) * circumference;

            return (
                <div className="flex flex-col items-center justify-center relative">
                    <svg className="w-14 h-14 transform -rotate-90">
                        <circle cx="28" cy="28" r={radius} stroke="currentColor" strokeWidth="4" className="text-slate-200" fill="transparent" />
                        <circle cx="28" cy="28" r={radius} stroke="currentColor" strokeWidth="4" strokeDasharray={circumference} strokeDashoffset={strokeDashoffset} strokeLinecap="round" className={`${colorClass} transition-all duration-300`} fill="transparent" />
                    </svg>
                    <div className="absolute inset-0 flex flex-col items-center justify-center text-center">
                        <span className="text-xs font-extrabold leading-none text-slate-700">{percentage}%</span>
                    </div>
                    <span className="text-[10px] font-bold mt-1 text-slate-500">{label}</span>
                </div>
            );
        }

        function App() {
            const [topicsData, setTopicsData] = useState(() => {
                const saved = localStorage.getItem('study_system_v13');
                if (saved) return JSON.parse(saved);
                return FIXED_TOPICS.map(name => ({ id: name, name, books: [] }));
            });

            const [activeTab, setActiveTab] = useState('curriculum');
            
            // ניווט היררכי לתוכנית לימודים
            const [currTopicName, setCurrTopicName] = useState(null);
            const [currBookId, setCurrBookId] = useState(null);

            // ניווט היררכי למעקב חזרות
            const [trackTopicName, setTrackTopicName] = useState(null);
            const [trackBookId, setTrackBookId] = useState(null);

            const [inputTopic, setInputTopic] = useState(FIXED_TOPICS[0]);
            const [inputBook, setInputBook] = useState('');
            const [inputChapter, setInputChapter] = useState('');
            const [inputDueDate, setInputDueDate] = useState('');

            useEffect(() => {
                localStorage.setItem('study_system_v13', JSON.stringify(topicsData));
            }, [topicsData]);

            const handleAddNewTask = (e) => {
                e.preventDefault();
                if (!inputBook.trim() || !inputChapter.trim()) return;

                const bookName = inputBook.trim();
                const chapterName = inputChapter.trim();
                const dueDate = inputDueDate || new Date().toISOString().split('T')[0];

                let newTopics = [...topicsData];
                let topicObj = newTopics.find(t => t.name === inputTopic);

                if (!topicObj) {
                    topicObj = { id: inputTopic, name: inputTopic, books: [] };
                    newTopics.push(topicObj);
                }

                let bookObj = topicObj.books.find(b => b.name === bookName);
                if (!bookObj) {
                    bookObj = { id: Date.now().toString(), name: bookName, chapters: [] };
                    topicObj.books.push(bookObj);
                }

                bookObj.chapters.push({
                    id: (Date.now() + 1).toString(),
                    name: chapterName,
                    count: 0,
                    dueDate: dueDate,
                    completed: false
                });

                setTopicsData(newTopics);
                setInputChapter('');
                setInputDueDate('');
            };

            const toggleChapterCompletion = (topicName, bookId, chapterId, currentStatus) => {
                setTopicsData(topicsData.map(t => {
                    if (t.name !== topicName) return t;
                    return {
                        ...t,
                        books: t.books.map(b => {
                            if (b.id !== bookId) return b;
                            return {
                                ...b,
                                chapters: b.chapters.map(c => {
                                    if (c.id !== chapterId) return c;
                                    const nextStatus = !currentStatus;
                                    return {
                                        ...c,
                                        completed: nextStatus,
                                        count: nextStatus && c.count === 0 ? 1 : c.count
                                    };
                                })
                            };
                        })
                    };
                }));
            };

            const updateCount = (topicName, bookId, chapterId, delta) => {
                setTopicsData(topicsData.map(t => {
                    if (t.name !== topicName) return t;
                    return {
                        ...t,
                        books: t.books.map(b => {
                            if (b.id !== bookId) return b;
                            return {
                                ...b,
                                chapters: b.chapters.map(c => {
                                    if (c.id !== chapterId) return c;
                                    const newVal = Math.max(0, Math.min(101, (c.count || 0) + delta));
                                    return { ...c, count: newVal };
                                })
                            };
                        })
                    };
                }));
            };

            // חישוב אחוזי השלמת לימוד לספר (מבוناد על סך הפרקים שהושלמו / סך הפרקים בספר)
            const getCurriculumBookStats = (chapters) => {
                if (chapters.length === 0) return { completedCount: 0, totalCount: 0, percentage: 0 };
                const completedCount = chapters.filter(c => c.completed).length;
                const percentage = Math.round((completedCount / chapters.length) * 100);
                return { completedCount, totalCount: chapters.length, percentage };
            };

            const getTrackingBookStats = (chapters) => {
                const activeChapters = chapters.filter(c => c.completed);
                if (activeChapters.length === 0) return { rawSum40: 0, rawMax40: 0, rawSum101: 0, rawMax101: 0 };

                const sum40 = activeChapters.reduce((acc, c) => acc + Math.min(c.count, 40), 0);
                const sum101 = activeChapters.reduce((acc, c) => acc + Math.min(c.count, 101), 0);
                
                return {
                    rawSum40: sum40,
                    rawMax40: activeChapters.length * 40,
                    rawSum101: sum101,
                    rawMax101: activeChapters.length * 101
                };
            };

            const allTasks = topicsData.flatMap(t => 
                t.books.flatMap(b => 
                    b.chapters.map(c => ({ ...c, topicName: t.name, bookName: b.name, bookId: b.id }))
                )
            );

            const uniqueDates = Array.from(new Set(allTasks.map(task => task.dueDate))).sort();
            const todayStr = new Date().toISOString().split('T')[0];
            if (!uniqueDates.includes(todayStr)) {
                uniqueDates.unshift(todayStr);
            }

            return (
                <div className="max-w-6xl mx-auto p-4 sm:p-6">
                    <header className="bg-emerald-700 text-white p-6 rounded-2xl shadow-md mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
                        <div>
                            <h1 className="text-2xl sm:text-3xl font-bold">ניהול לימודים וחזרות</h1>
                            <p className="text-emerald-100 text-sm mt-1">מערכת חכמה לניהול חזורי 40 ו-101</p>
                        </div>
                        <div className="flex flex-wrap bg-emerald-800 p-1 rounded-xl gap-1">
                            <button 
                                onClick={() => { setActiveTab('curriculum'); setCurrTopicName(null); setCurrBookId(null); }}
                                className={`px-3 py-2 rounded-lg text-sm font-medium transition ${activeTab === 'curriculum' ? 'bg-white text-emerald-800 shadow' : 'text-white hover:bg-emerald-700'}`}>
                                📖 תוכנית לימודים
                            </button>
                            <button 
                                onClick={() => setActiveTab('calendar')}
                                className={`px-3 py-2 rounded-lg text-sm font-medium transition ${activeTab === 'calendar' ? 'bg-white text-emerald-800 shadow' : 'text-white hover:bg-emerald-700'}`}>
                                📅 לוח שנה
                            </button>
                            <button 
                                onClick={() => { setActiveTab('tracking'); setTrackTopicName(null); setTrackBookId(null); }}
                                className={`px-3 py-2 rounded-lg text-sm font-medium transition ${activeTab === 'tracking' ? 'bg-white text-emerald-800 shadow' : 'text-white hover:bg-emerald-700'}`}>
                                📚 מעקב חזרות
                            </button>
                        </div>
                    </header>

                    {/* לשונית 1: תוכנית לימודים (היררכיה: נושא ➔ ספר ➔ פרקים עם אחוזים) */}
                    {activeTab === 'curriculum' && (
                        <div className="space-y-6">
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                                <h2 className="text-lg font-bold text-slate-800 mb-3 flex items-center gap-2">
                                    <span>➕</span> הוספת פרק/סימן חדש לתוכנית
                                </h2>
                                <form onSubmit={handleAddNewTask} className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">נושא קבוע</label>
                                        <select 
                                            value={inputTopic} 
                                            onChange={e => setInputTopic(e.target.value)}
                                            className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-emerald-600">
                                            {FIXED_TOPICS.map(t => <option key={t} value={t}>{t}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">ספר / מסכת</label>
                                        <input 
                                            type="text" placeholder="שם הספר..." value={inputBook}
                                            onChange={e => setInputBook(e.target.value)}
                                            className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-emerald-600" required
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">פרק / סימן</label>
                                        <input 
                                            type="text" placeholder="שם הפרק..." value={inputChapter}
                                            onChange={e => setInputChapter(e.target.value)}
                                            className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-emerald-600" required
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">תאריך יעד</label>
                                        <input 
                                            type="date" value={inputDueDate}
                                            onChange={e => setInputDueDate(e.target.value)}
                                            className="w-full border border-slate-300 rounded-lg px-2 py-2 text-sm focus:outline-emerald-600"
                                        />
                                    </div>
                                    <div className="flex items-end">
                                        <button type="submit" className="w-full bg-emerald-600 text-white font-bold px-4 py-2 rounded-lg text-sm hover:bg-emerald-700">הוסף למערכת</button>
                                    </div>
                                </form>
                            </div>

                            {/* רמה א': בחירת נושא בתוכנית לימודים */}
                            {!currTopicName && (
                                <div className="space-y-4">
                                    <h2 className="text-xl font-bold text-emerald-900">בחר נושא לימוד:</h2>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                                        {topicsData.map(topic => (
                                            <div 
                                                key={topic.name}
                                                onClick={() => setCurrTopicName(topic.name)}
                                                className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:border-emerald-500 cursor-pointer transition flex items-center justify-between group">
                                                <div>
                                                    <h3 className="text-lg font-bold text-slate-800 group-hover:text-emerald-700 transition">{topic.name}</h3>
                                                    <p className="text-xs text-slate-400 mt-1">{topic.books.length} ספרים במערכת</p>
                                                </div>
                                                <span className="text-emerald-600 font-bold text-lg">&larr;</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* רמה ב': בחירת ספר מתוך הנושא בתוכנית לימודים */}
                            {currTopicName && !currBookId && (() => {
                                const topic = topicsData.find(t => t.name === currTopicName);
                                if (!topic) return null;

                                return (
                                    <div className="space-y-4">
                                        <div className="flex items-center gap-3">
                                            <button onClick={() => setCurrTopicName(null)} className="bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-sm font-bold hover:bg-slate-300">&rarr; חזרה לנושאים</button>
                                            <h2 className="text-xl font-bold text-emerald-900">{topic.name} &gt; בחר ספר:</h2>
                                        </div>

                                        <div className="grid grid-cols-1 gap-4">
                                            {topic.books.length === 0 ? (
                                                <p className="text-sm text-slate-500 bg-white p-6 rounded-2xl border">אין ספרים תחת נושא זה עדיין.</p>
                                            ) : (
                                                topic.books.map(book => {
                                                    const stats = getCurriculumBookStats(book.chapters);

                                                    return (
                                                        <div 
                                                            key={book.id}
                                                            onClick={() => setCurrBookId(book.id)}
                                                            className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 hover:border-emerald-500 cursor-pointer transition flex flex-col sm:flex-row items-center justify-between gap-4">
                                                            <div>
                                                                <h3 className="text-lg font-bold text-slate-800">{book.name}</h3>
                                                                <p className="text-xs text-slate-400 mt-0.5">{stats.completedCount} מתוך {stats.totalCount} פרקים הושלמו</p>
                                                            </div>

                                                            {/* מעגל התקדמות אחוזי השלמת הלימוד לספר */}
                                                            <div className="flex items-center gap-4 bg-slate-50 px-4 py-2 rounded-xl border border-slate-100">
                                                                <CircularProgress count={stats.completedCount} max={stats.totalCount || 1} colorClass="text-emerald-600" label="השלמה" />
                                                            </div>
                                                        </div>
                                                    );
                                                })
                                            )}
                                        </div>
                                    </div>
                                );
                            })()}

                            {/* רמה ג': הצגת הפרקים של הספר הנבחר בתוכנית לימודים */}
                            {currTopicName && currBookId && (() => {
                                const topic = topicsData.find(t => t.name === currTopicName);
                                const book = topic?.books.find(b => b.id === currBookId);
                                if (!topic || !book) return null;

                                return (
                                    <div className="space-y-4">
                                        <div className="flex items-center gap-3 border-b pb-3">
                                            <button onClick={() => setCurrBookId(null)} className="bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-sm font-bold hover:bg-slate-300">&rarr; חזרה לספרים</button>
                                            <h2 className="text-xl font-extrabold text-emerald-900">{topic.name} &gt; {book.name}</h2>
                                        </div>

                                        <div className="grid grid-cols-1 gap-3">
                                            {book.chapters.map(chapter => {
                                                const isOverdue = !chapter.completed && new Date(chapter.dueDate) < new Date(new Date().toDateString());
                                                return (
                                                    <div key={chapter.id} className={`p-4 rounded-xl border shadow-sm flex items-center justify-between gap-4 ${chapter.completed ? 'bg-emerald-50 border-emerald-300' : isOverdue ? 'bg-rose-50 border-rose-200' : 'bg-white border-slate-200'}`}>
                                                        <div className="flex items-center gap-3">
                                                            <input 
                                                                type="checkbox" checked={chapter.completed} 
                                                                onChange={() => toggleChapterCompletion(topic.name, book.id, chapter.id, chapter.completed)}
                                                                className="w-6 h-6 accent-emerald-600 rounded cursor-pointer"
                                                            />
                                                            <div>
                                                                <h4 className={`font-bold text-base ${chapter.completed ? 'line-through text-slate-400' : 'text-slate-800'}`}>{chapter.name}</h4>
                                                                <p className="text-xs text-slate-400">יעד לימוד: {getHebrewDateString(chapter.dueDate)}</p>
                                                            </div>
                                                        </div>
                                                        <span className={`text-xs px-3 py-1.5 rounded-full font-bold ${chapter.completed ? 'bg-emerald-100 text-emerald-800' : isOverdue ? 'bg-rose-100 text-rose-800' : 'bg-slate-100 text-slate-600'}`}>
                                                            {chapter.completed ? 'נלמד ✓' : isOverdue ? 'עבר הזמן' : 'ממתין'}
                                                        </span>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                );
                            })()}
                        </div>
                    )}

                    {/* לשונית 2: לוח שנה */}
                    {activeTab === 'calendar' && (
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4 overflow-x-auto">
                            <h2 className="text-xl font-bold text-emerald-900 border-b pb-2">לוח שנה ומעקב יומי</h2>
                            <div className="min-w-[900px] space-y-3">
                                {uniqueDates.map(dateStr => {
                                    const isToday = dateStr === todayStr;
                                    const isPast = new Date(dateStr) < new Date(todayStr);
                                    const isYellow = isPast || isToday;

                                    const dateTasks = allTasks.filter(t => t.dueDate === dateStr);
                                    const hebrewDateText = getHebrewDateString(dateStr);

                                    return (
                                        <div key={dateStr} className={`rounded-xl border p-4 transition ${isYellow ? 'bg-amber-100/80 border-amber-300 shadow-sm' : 'bg-white border-slate-200'}`}>
                                            <div className="flex items-center justify-between mb-3 border-b border-amber-200/60 pb-2">
                                                <div className="flex items-center gap-2">
                                                    <span className={`text-sm font-extrabold px-3 py-1 rounded-lg ${isToday ? 'bg-amber-400 text-slate-900 shadow-sm' : 'bg-amber-200/70 text-slate-800'}`}>
                                                        {hebrewDateText} {isToday ? '(היום)' : ''}
                                                    </span>
                                                    <span className="text-xs text-slate-500">({dateStr})</span>
                                                </div>
                                            </div>

                                            {/* שורת 7 הנושאים הקבועים */}
                                            <div className="grid grid-cols-7 gap-2">
                                                {FIXED_TOPICS.map(topicName => {
                                                    const topicTasks = dateTasks.filter(t => t.topicName === topicName);
                                                    return (
                                                        <div key={topicName} className="bg-white/90 p-2.5 rounded-lg border border-slate-200 min-h-[75px] flex flex-col justify-between">
                                                            <div className="text-[11px] font-bold text-emerald-800 border-b pb-1 mb-1">{topicName}</div>
                                                            <div className="space-y-1.5 flex-1">
                                                                {topicTasks.length === 0 ? (
                                                                    <span className="text-[10px] text-slate-300 block text-center mt-2">-</span>
                                                                ) : (
                                                                    topicTasks.map(task => (
                                                                        <div key={task.id} className="flex items-center justify-between gap-1 bg-slate-50 p-1 rounded text-[11px]">
                                                                            <span className={`truncate font-medium ${task.completed ? 'line-through text-slate-400' : 'text-slate-700'}`} title={task.name}>{task.bookName}: {task.name}</span>
                                                                            <input 
                                                                                type="checkbox" checked={task.completed}
                                                                                onChange={() => toggleChapterCompletion(task.topicName, task.bookId, task.id, task.completed)}
                                                                                className="accent-emerald-600 w-4 h-4 shrink-0 cursor-pointer"
                                                                            />
                                                                        </div>
                                                                    ))
                                                                )}
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>

                                            {/* שורת חזרות נפרדת */}
                                            <div className="mt-3 bg-slate-100 p-3 rounded-lg border border-slate-200 flex items-center justify-between">
                                                <span className="text-xs font-bold text-slate-600">חזרות לימוד (יומי):</span>
                                                <span className="text-xs text-slate-500">למעקב מפורט היכנס ללשונית "מעקב חזרות"</span>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    {/* לשונית 3: מעקב חזרות */}
                    {activeTab === 'tracking' && (
                        <div className="space-y-6">
                            {!trackTopicName && (
                                <div className="space-y-4">
                                    <h2 className="text-xl font-bold text-emerald-900">בחר נושא לחזרות:</h2>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                                        {topicsData.map(topic => {
                                            const hasActive = topic.books.some(b => b.chapters.some(c => c.completed));
                                            return (
                                                <div 
                                                    key={topic.name}
                                                    onClick={() => setTrackTopicName(topic.name)}
                                                    className={`bg-white p-6 rounded-2xl shadow-sm border cursor-pointer transition flex items-center justify-between group ${hasActive ? 'border-slate-200 hover:border-emerald-500' : 'opacity-60 border-slate-200'}`}>
                                                    <div>
                                                        <h3 className="text-lg font-bold text-slate-800 group-hover:text-emerald-700 transition">{topic.name}</h3>
                                                        <p className="text-xs text-slate-400 mt-1">{topic.books.length} ספרים במערכת</p>
                                                    </div>
                                                    <span className="text-emerald-600 font-bold text-lg">&larr;</span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}

                            {trackTopicName && !trackBookId && (() => {
                                const topic = topicsData.find(t => t.name === trackTopicName);
                                if (!topic) return null;

                                return (
                                    <div className="space-y-4">
                                        <div className="flex items-center gap-3">
                                            <button onClick={() => setTrackTopicName(null)} className="bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-sm font-bold hover:bg-slate-300">&rarr; חזרה לנושאים</button>
                                            <h2 className="text-xl font-bold text-emerald-900">{topic.name} &gt; בחר ספר:</h2>
                                        </div>

                                        <div className="grid grid-cols-1 gap-4">
                                            {topic.books.map(book => {
                                                const completedChapters = book.chapters.filter(c => c.completed);
                                                if (completedChapters.length === 0) return null;
                                                const stats = getTrackingBookStats(book.chapters);

                                                return (
                                                    <div 
                                                        key={book.id}
                                                        onClick={() => setTrackBookId(book.id)}
                                                        className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 hover:border-emerald-500 cursor-pointer transition flex flex-col sm:flex-row items-center justify-between gap-4">
                                                        <div>
                                                            <h3 className="text-lg font-bold text-slate-800">{book.name}</h3>
                                                            <p className="text-xs text-slate-400 mt-0.5">{completedChapters.length} פרקים פעילים לחזרות</p>
                                                        </div>

                                                        <div className="flex items-center gap-6 bg-slate-50 px-4 py-2 rounded-xl border border-slate-100">
                                                            <CircularProgress count={stats.rawSum40} max={stats.rawMax40} colorClass="text-emerald-600" label="יעד 40" />
                                                            <div className="h-8 w-px bg-slate-200"></div>
                                                            <CircularProgress count={stats.rawSum101} max={stats.rawMax101} colorClass="text-blue-600" label="יעד 101" />
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                );
                            })()}

                            {trackTopicName && trackBookId && (() => {
                                const topic = topicsData.find(t => t.name === trackTopicName);
                                const book = topic?.books.find(b => b.id === trackBookId);
                                if (!topic || !book) return null;

                                const completedChapters = book.chapters.filter(c => c.completed);

                                return (
                                    <div className="space-y-4">
                                        <div className="flex items-center gap-3 border-b pb-3">
                                            <button onClick={() => setTrackBookId(null)} className="bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-sm font-bold hover:bg-slate-300">&rarr; חזרה לספרים</button>
                                            <h2 className="text-xl font-extrabold text-emerald-900">{topic.name} &gt; {book.name}</h2>
                                        </div>

                                        <div className="grid grid-cols-1 gap-3">
                                            {completedChapters.map(chapter => {
                                                const count = chapter.count || 0;
                                                const target = count <= 40 ? 40 : 101;
                                                const isPhase101 = count > 40;

                                                return (
                                                    <div key={chapter.id} className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4">
                                                        <div className="flex items-center gap-3 w-full sm:w-auto">
                                                            <div className={`w-3 h-3 rounded-full shrink-0 ${isPhase101 ? 'bg-blue-500' : 'bg-emerald-500'}`}></div>
                                                            <div>
                                                                <h4 className="font-bold text-base text-slate-800">{chapter.name}</h4>
                                                                <p className="text-xs text-slate-400">חזרות: <span className="font-bold text-slate-700">{count}</span> מתוך <span className="font-bold text-slate-700">{target}</span></p>
                                                            </div>
                                                        </div>

                                                        <div className="flex items-center gap-4 w-full sm:w-auto justify-between bg-slate-50 px-4 py-2 rounded-xl border border-slate-100">
                                                            <CircularProgress count={count} max={target} colorClass={isPhase101 ? 'text-blue-600' : 'text-emerald-600'} label={isPhase101 ? 'יעד 101' : 'יעד 40'} />

                                                            <div className="flex items-center gap-1 bg-white p-1 rounded-lg border border-slate-200 shadow-sm mr-2">
                                                                <button onClick={() => updateCount(topic.name, book.id, chapter.id, -1)} className="w-7 h-7 bg-slate-100 text-slate-700 rounded-md font-bold hover:bg-slate-200 text-sm flex items-center justify-center">-</button>
                                                                <span className="w-8 text-center text-sm font-extrabold text-slate-800">{count}</span>
                                                                <button onClick={() => updateCount(topic.name, book.id, chapter.id, 1)} className="w-7 h-7 bg-emerald-600 text-white rounded-md font-bold hover:bg-emerald-700 text-sm flex items-center justify-center">+</button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                );
                            })()}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
