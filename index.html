<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול לימודים וחזרות - 40 ו-101</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [topics, setTopics] = useState(() => {
                const saved = localStorage.getItem('study_topics_v4');
                if (saved) return JSON.parse(saved);
                return [
                    {
                        id: '1',
                        name: 'תלמוד בבלי',
                        books: [
                            {
                                id: 'b1',
                                name: 'מסכת ברכות',
                                chapters: [
                                    { id: 'c1', name: 'פרק א - מאמתי', c40: 0, c101: 0, dueDate: '2026-11-05', completed: false },
                                    { id: 'c2', name: 'פרק ב - היה קורא', c40: 0, c101: 0, dueDate: '2026-11-10', completed: false }
                                ]
                            }
                        ]
                    }
                ];
            });

            const [activeTab, setActiveTab] = useState('topics');
            const [newTopicName, setNewTopicName] = useState('');
            const [selectedTopicId, setSelectedTopicId] = useState('');
            const [newBookName, setNewBookName] = useState('');
            const [selectedBookId, setSelectedBookId] = useState('');
            const [newChapterName, setNewChapterName] = useState('');
            const [newChapterDate, setNewChapterDate] = useState('');

            useEffect(() => {
                localStorage.setItem('study_topics_v4', JSON.stringify(topics));
            }, [topics]);

            const handleAddTopic = (e) => {
                e.preventDefault();
                if (!newTopicName.trim()) return;
                setTopics([...topics, { id: Date.now().toString(), name: newTopicName, books: [] }]);
                setNewTopicName('');
            };

            const handleAddBook = (e) => {
                e.preventDefault();
                if (!selectedTopicId || !newBookName.trim()) return;
                setTopics(topics.map(t => {
                    if (t.id === selectedTopicId) {
                        return {
                            ...t,
                            books: [...t.books, { id: Date.now().toString(), name: newBookName, chapters: [] }]
                        };
                    }
                    return t;
                }));
                setNewBookName('');
            };

            const handleAddChapter = (e) => {
                e.preventDefault();
                if (!selectedBookId || !newChapterName.trim()) return;
                setTopics(topics.map(t => ({
                    ...t,
                    books: t.books.map(b => {
                        if (b.id === selectedBookId) {
                            return {
                                ...b,
                                chapters: [...b.chapters, {
                                    id: Date.now().toString(),
                                    name: newChapterName,
                                    c40: 0,
                                    c101: 0,
                                    dueDate: newChapterDate || new Date().toISOString().split('T')[0],
                                    completed: false
                                }]
                            };
                        }
                        return b;
                    })
                })));
                setNewChapterName('');
                setNewChapterDate('');
            };

            const updateChapter = (topicId, bookId, chapterId, field, value) => {
                setTopics(topics.map(t => {
                    if (t.id !== topicId) return t;
                    return {
                        ...t,
                        books: t.books.map(b => {
                            if (b.id !== bookId) return b;
                            return {
                                ...b,
                                chapters: b.chapters.map(c => {
                                    if (c.id !== chapterId) return c;
                                    let updated = { ...c, [field]: value };
                                    if (field === 'completed' && value && c.c40 < 40) {
                                        updated.c40 = c.c40 + 1;
                                    }
                                    return updated;
                                })
                            };
                        })
                    };
                }));
            };

            const getBookProgress = (chapters) => {
                if (chapters.length === 0) return { p40: 0, p101: 0 };
                let total40 = chapters.reduce((acc, c) => acc + Math.min(c.c40, 40), 0);
                let total101 = chapters.reduce((acc, c) => acc + Math.min(c.c101, 101), 0);
                let max40 = chapters.length * 40;
                let max101 = chapters.length * 101;
                return {
                    p40: Math.round((total40 / max40) * 100),
                    p101: Math.round((total101 / max101) * 100)
                };
            };

            return (
                <div className="max-w-4xl mx-auto p-4 sm:p-6">
                    <header className="bg-emerald-700 text-white p-6 rounded-2xl shadow-md mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
                        <div>
                            <h1 className="text-2xl sm:text-3xl font-bold">ניהול לימודים וחזרות</h1>
                            <p className="text-emerald-100 text-sm mt-1">ניהול חזורי 40 ו-101 במבנה מרוכז</p>
                        </div>
                        <div className="flex bg-emerald-800 p-1 rounded-xl">
                            <button 
                                onClick={() => setActiveTab('topics')}
                                className={`px-4 py-2 rounded-lg text-sm font-medium transition ${activeTab === 'topics' ? 'bg-white text-emerald-800 shadow' : 'text-white hover:bg-emerald-700'}`}>
                                נושאים וספרים
                            </button>
                            <button 
                                onClick={() => setActiveTab('calendar')}
                                className={`px-4 py-2 rounded-lg text-sm font-medium transition ${activeTab === 'calendar' ? 'bg-white text-emerald-800 shadow' : 'text-white hover:bg-emerald-700'}`}>
                                לוח שנה ומשימות
                            </button>
                        </div>
                    </header>

                    {activeTab === 'topics' ? (
                        <div className="space-y-6">
                            <div className="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-100 grid grid-cols-1 md:grid-cols-3 gap-4">
                                <form onSubmit={handleAddTopic} className="space-y-2">
                                    <label className="text-xs font-bold text-slate-500">הוספת נושא חדש</label>
                                    <div className="flex gap-2">
                                        <input 
                                            type="text" placeholder="שם הנושא..." 
                                            value={newTopicName} onChange={e => setNewTopicName(e.target.value)}
                                            className="border border-slate-200 rounded-lg px-3 py-2 text-sm flex-1 focus:outline-emerald-600"
                                        />
                                        <button type="submit" className="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-emerald-700">הוסף</button>
                                    </div>
                                </form>

                                <form onSubmit={handleAddBook} className="space-y-2">
                                    <label className="text-xs font-bold text-slate-500">הוספת ספר לנושא</label>
                                    <select 
                                        value={selectedTopicId} onChange={e => setSelectedTopicId(e.target.value)}
                                        className="border border-slate-200 rounded-lg px-3 py-2 text-sm w-full focus:outline-emerald-600">
                                        <option value="">בחר נושא...</option>
                                        {topics.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                    </select>
                                    <div className="flex gap-2">
                                        <input 
                                            type="text" placeholder="שם הספר..." 
                                            value={newBookName} onChange={e => setNewBookName(e.target.value)}
                                            className="border border-slate-200 rounded-lg px-3 py-2 text-sm flex-1 focus:outline-emerald-600"
                                        />
                                        <button type="submit" className="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-emerald-700">הוסף</button>
                                    </div>
                                </form>

                                <form onSubmit={handleAddChapter} className="space-y-2">
                                    <label className="text-xs font-bold text-slate-500">הוספת פרק/סימן לספר</label>
                                    <select 
                                        value={selectedBookId} onChange={e => setSelectedBookId(e.target.value)}
                                        className="border border-slate-200 rounded-lg px-3 py-2 text-sm w-full focus:outline-emerald-600">
                                        <option value="">בחר ספר...</option>
                                        {topics.map(t => t.books.map(b => <option key={b.id} value={b.id}>{t.name} &gt; {b.name}</option>))}
                                    </select>
                                    <div className="flex gap-2">
                                        <input 
                                            type="text" placeholder="שם הפרק..." 
                                            value={newChapterName} onChange={e => setNewChapterName(e.target.value)}
                                            className="border border-slate-200 rounded-lg px-3 py-2 text-sm flex-1 focus:outline-emerald-600"
                                        />
                                        <input 
                                            type="date" 
                                            value={newChapterDate} onChange={e => setNewChapterDate(e.target.value)}
                                            className="border border-slate-200 rounded-lg px-2 py-2 text-xs"
                                        />
                                        <button type="submit" className="bg-emerald-600 text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-emerald-700">הוסף</button>
                                    </div>
                                </form>
                            </div>

                            {topics.map(topic => (
                                <div key={topic.id} className="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 space-y-4">
                                    <h2 className="text-xl font-bold text-emerald-900 border-b pb-2">{topic.name}</h2>
                                    
                                    {topic.books.length === 0 ? (
                                        <p className="text-sm text-slate-400">אין עדיין ספרים תחת נושא זה.</p>
                                    ) : (
                                        topic.books.map(book => {
                                            const progress = getBookProgress(book.chapters);
                                            return (
                                                <div key={book.id} className="bg-slate-50 rounded-xl p-4 border border-slate-100 space-y-3">
                                                    <div className="flex justify-between items-center">
                                                        <h3 className="font-bold text-slate-700">{book.name}</h3>
                                                        <div className="flex gap-3 text-xs font-semibold">
                                                            <span className="bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full">40: {progress.p40}%</span>
                                                            <span className="bg-blue-100 text-blue-800 px-2.5 py-1 rounded-full">101: {progress.p101}%</span>
                                                        </div>
                                                    </div>

                                                    <div className="space-y-2">
                                                        {book.chapters.map(chapter => (
                                                            <div key={chapter.id} className="bg-white p-3 rounded-lg border border-slate-200 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                                                                <div className="flex items-center gap-3">
                                                                    <input 
                                                                        type="checkbox" 
                                                                        checked={chapter.completed} 
                                                                        onChange={e => updateChapter(topic.id, book.id, chapter.id, 'completed', e.target.checked)}
                                                                        className="w-5 h-5 accent-emerald-600 rounded cursor-pointer"
                                                                    />
                                                                    <div>
                                                                        <span className={`font-medium text-sm ${chapter.completed ? 'line-through text-slate-400' : 'text-slate-800'}`}>{chapter.name}</span>
                                                                        <div className="text-xs text-slate-400">יעד: {chapter.dueDate}</div>
                                                                    </div>
                                                                </div>

                                                                {/* Unified Counters View - 40 & 101 Together */}
                                                                <div className="flex items-center gap-4 bg-slate-50 px-3 py-1.5 rounded-xl border border-slate-100 w-full sm:w-auto justify-between">
                                                                    <div className="flex items-center gap-2">
                                                                        <span className="text-xs font-bold text-emerald-700">40:</span>
                                                                        <button onClick={() => updateChapter(topic.id, book.id, chapter.id, 'c40', Math.max(0, chapter.c40 - 1))} className="w-6 h-6 bg-slate-200 rounded-md font-bold text-xs hover:bg-slate-300">-</button>
                                                                        <span className="w-8 text-center text-sm font-bold">{chapter.c40}</span>
                                                                        <button onClick={() => updateChapter(topic.id, book.id, chapter.id, 'c40', chapter.c40 + 1)} className="w-6 h-6 bg-emerald-600 text-white rounded-md font-bold text-xs hover:bg-emerald-700">+</button>
                                                                    </div>

                                                                    <div className="h-4 w-px bg-slate-300"></div>

                                                                    <div className="flex items-center gap-2">
                                                                        <span className="text-xs font-bold text-blue-700">101:</span>
                                                                        <button onClick={() => updateChapter(topic.id, book.id, chapter.id, 'c101', Math.max(0, chapter.c101 - 1))} className="w-6 h-6 bg-slate-200 rounded-md font-bold text-xs hover:bg-slate-300">-</button>
                                                                        <span className="w-8 text-center text-sm font-bold">{chapter.c101}</span>
                                                                        <button onClick={() => updateChapter(topic.id, book.id, chapter.id, 'c101', chapter.c101 + 1)} className="w-6 h-6 bg-blue-600 text-white rounded-md font-bold text-xs hover:bg-blue-700">+</button>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            );
                                        })
                                    )}
                                </div>
                            ))}
                        </div>
                    ) : (
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                            <h2 className="text-xl font-bold text-emerald-900 border-b pb-2">לוח משימות ותאריכי יעד</h2>
                            <div className="space-y-3">
                                {topics.flatMap(t => t.books.flatMap(b => b.chapters.map(c => ({ ...c, topicName: t.name, bookName: b.name, topicId: t.id, bookId: b.id }))))
                                    .sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate))
                                    .map(task => {
                                        const isOverdue = !task.completed && new Date(task.dueDate) < new Date(new Date().toDateString());
                                        return (
                                            <div key={task.id} className={`p-4 rounded-xl border flex items-center justify-between gap-4 ${task.completed ? 'bg-emerald-50/50 border-emerald-200' : isOverdue ? 'bg-rose-50/50 border-rose-200' : 'bg-white border-slate-200'}`}>
                                                <div className="flex items-center gap-3">
                                                    <input 
                                                        type="checkbox" 
                                                        checked={task.completed} 
                                                        onChange={e => updateChapter(task.topicId, task.bookId, task.id, 'completed', e.target.checked)}
                                                        className="w-5 h-5 accent-emerald-600 rounded cursor-pointer"
                                                    />
                                                    <div>
                                                        <div className="text-xs text-slate-500 font-medium">{task.topicName} &gt; {task.bookName}</div>
                                                        <div className={`font-bold text-sm ${task.completed ? 'line-through text-slate-400' : 'text-slate-800'}`}>{task.name}</div>
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-3">
                                                    <span className={`text-xs px-3 py-1 rounded-full font-bold ${task.completed ? 'bg-emerald-100 text-emerald-800' : isOverdue ? 'bg-rose-100 text-rose-800' : 'bg-slate-100 text-slate-600'}`}>
                                                        {task.completed ? 'בוצע ✓' : isOverdue ? `עבר הזמן (${task.dueDate})` : `יעד: ${task.dueDate}`}
                                                    </span>
                                                </div>
                                            </div>
                                        );
                                    })}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
